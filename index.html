<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undiscovered Minecraft SMPs</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-color: #1f1f1f;
            --accent-color: #388e3c;
            --text-color: #f5f5f5;
            --text-secondary: #aaaaaa;
            --mc-gold: #ffaa00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            max-width: 800px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px #000;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 0px #245a26;
        }

        .search-btn:hover {
            background-color: #2e7d32;
        }

        .search-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }

        .video-card {
            background-color: var(--card-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
        }

        .thumbnail-box {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #2c3e50 0%, #0f171e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 3px solid var(--accent-color);
        }

        .thumbnail-box::before {
            content: '⛏️';
            font-size: 3rem;
            margin-bottom: 5px;
        }

        .live-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: #d32f2f;
            color: white;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .video-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 12px 0;
            line-height: 1.4;
            color: #ffffff;
        }

        .video-meta {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .stat-highlight {
            color: var(--mc-gold);
            font-weight: bold;
        }

        .launch-link {
            display: block;
            text-align: center;
            background-color: #444;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
            border: 1px solid #555;
            margin-top: auto;
        }

        .launch-link:hover {
            background-color: #555;
            color: var(--mc-gold);
        }
    </style>
</head>
<body>

    <header>
        <h1>💎 Live SMP Recruitment Finder 💎</h1>
        <p>This panel generates direct tunnels into YouTube's time-sorted engine to capture authentic, fresh recruitment videos with nearly 0 views.</p>
        
        <div class="controls">
            <button class="search-btn" onclick="openLiveScanner('general')">🔍 Scan All Fresh SMP Apps</button>
            <button class="search-btn" style="background-color: #b71c1c; box-shadow: 0 4px 0px #7f1414;" onclick="openLiveScanner('lifesteal')">🩸 Scan Lifesteal SMPs</button>
            <button class="search-btn" style="background-color: #0d47a1; box-shadow: 0 4px 0px #082d66;" onclick="openLiveScanner('vanilla')">🌲 Scan Pure Vanilla</button>
        </div>
    </header>

    <div class="video-grid" id="finderGrid">
        <!-- Live Tunnels will generate here automatically -->
    </div>

    <script>
        function generateLiveTunnels() {
            const grid = document.getElementById('finderGrid');
            grid.innerHTML = ''; // Reset grid

            const customTunnels = [
                {
                    title: "Brand New Today: General Recruitment Feed",
                    desc: "Forces YouTube to bypass its recommendation servers. Displays raw uploads from the last 24 hours. Most videos have <span class='stat-highlight'>0 to 12 views</span>.",
                    query: "Minecraft SMP application"
                },
                {
                    title: "Fresh Lifesteal & PvP SMP Openings",
                    desc: "Targets competitive action servers seeking new members immediately. Cleansed of massive creators so you talk straight to the owner.",
                    query: "Minecraft Lifesteal SMP application"
                },
                {
                    title: "Small Scale Whitelist & Lore Communities",
                    desc: "Filters for intimate storytelling or tightly regulated 20-player groups that uploaded a recruitment trailer within the last few hours.",
                    query: "Minecraft Vanilla SMP recruitment"
                }
            ];

            customTunnels.forEach(tunnel => {
                const targetUrl = `https://youtube.com{encodeURIComponent('"' + tunnel.query + '"')}&sp=EgIIAg%253D%253D`;
                
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail-box">
                        <span class="live-tag">LIVE FEED</span>
                    </div>
                    <div class="video-info">
                        <h3 class="video-title">${tunnel.title}</h3>
                        <p class="video-meta">${tunnel.desc}</p>
                        <a href="${targetUrl}" target="_blank" class="launch-link">Launch Live Search Tunnel 🚀</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openLiveScanner(type) {
            let baseQuery = "Minecraft SMP application";
            if (type === 'lifesteal') baseQuery = "Minecraft Lifesteal SMP application";
            if (type === 'vanilla') baseQuery = "Minecraft Vanilla SMP recruitment";
            
            // This parameter (sp=EgIIAg%3D%3D) forces YouTube to sort purely by the upload minute
            const liveUrl = `https://youtube.com{encodeURIComponent('"' + baseQuery + '"')}&sp=EgIIAg%253D%253D`;
            window.open(liveUrl, '_blank');
        }

        // Run automatically when the site opens
        window.onload = generateLiveTunnels;
    </script>
</body>
</html>
